<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blood Requests</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">

            <h3>Blood Requests</h3>

            <a th:href="@{/addRequest}" class="btn btn-light">
                + New Request
            </a>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Patient Name</th>
                    <th>Blood Group</th>
                    <th>Units Required</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="request : ${requests}">

                    <td th:text="${request.requestId}"></td>

                    <td th:text="${request.patientName}"></td>

                    <td>
                        <span class="badge bg-danger"
                              th:text="${request.bloodGroup}">
                        </span>
                    </td>

                    <td th:text="${request.unitsRequired}"></td>

                    <td>

                        <span class="badge bg-warning text-dark"
                              th:if="${request.status == 'PENDING'}">
                            PENDING
                        </span>

                        <span class="badge bg-success"
                              th:if="${request.status == 'APPROVED'}">
                            APPROVED
                        </span>

                        <span class="badge bg-danger"
                              th:if="${request.status == 'REJECTED'}">
                            REJECTED
                        </span>

                    </td>

                    <td>

                        <a th:href="@{'/editRequest/' + ${request.requestId}}"
                           class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <a th:href="@{'/deleteRequest/' + ${request.requestId}}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this request?')">
                            Delete
                        </a>

                        <a th:if="${request.status == 'PENDING'}"
                           th:href="@{'/approveRequest/' + ${request.requestId}}"
                           class="btn btn-success btn-sm">
                            Approve
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
