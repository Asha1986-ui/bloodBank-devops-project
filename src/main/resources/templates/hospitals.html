<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hospitals</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white d-flex justify-content-between">

            <h3>Hospitals</h3>

            <a th:href="@{/addHospital}" class="btn btn-light">
                + Add Hospital
            </a>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Hospital Name</th>
                    <th>City</th>
                    <th>Contact</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="hospital : ${hospitals}">

                    <td th:text="${hospital.hospitalId}"></td>
                    <td th:text="${hospital.hospitalName}"></td>
                    <td th:text="${hospital.city}"></td>
                    <td th:text="${hospital.contactNumber}"></td>
                    <td th:text="${hospital.email}"></td>

                    <td>

                        <a th:href="@{'/editHospital/' + ${hospital.hospitalId}}"
                           class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <a th:href="@{'/deleteHospital/' + ${hospital.hospitalId}}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this hospital?')">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
