<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Inventory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>Add Blood Stock</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/saveInventory}" th:object="${inventory}" method="post">

                <div class="mb-3">
                    <label>Blood Group</label>
                    <select class="form-control" th:field="*{bloodGroup}">
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Units</label>
                    <input type="number" class="form-control" th:field="*{units}" required>
                </div>

                <button type="submit" class="btn btn-success">
                    Save
                </button>

                <a th:href="@{/inventory}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
