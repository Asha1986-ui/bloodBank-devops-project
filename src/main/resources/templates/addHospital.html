<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Add Hospital</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Add Hospital</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/saveHospital}" th:object="${hospital}" method="post">

                <input type="hidden" th:field="*{hospitalId}"/>

                <div class="mb-3">
                    <label>Hospital Name</label>
                    <input type="text" class="form-control"
                           th:field="*{hospitalName}" required>
                </div>

                <div class="mb-3">
                    <label>City</label>
                    <input type="text" class="form-control"
                           th:field="*{city}" required>
                </div>

                <div class="mb-3">
                    <label>Contact Number</label>
                    <input type="text" class="form-control"
                           th:field="*{contactNumber}" required>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" class="form-control"
                           th:field="*{email}" required>
                </div>

                <button class="btn btn-success">
                    Save Hospital
                </button>

                <a href="/hospitals" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
