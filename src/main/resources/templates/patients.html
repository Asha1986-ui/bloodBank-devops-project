<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Patients</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">

            <h3>Patients</h3>

            <a th:href="@{/addPatient}" class="btn btn-light">
                + Add Patient
            </a>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Blood Group</th>
                    <th>Disease</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="patient : ${patients}">

                    <td th:text="${patient.patientId}"></td>
                    <td th:text="${patient.patientName}"></td>
                    <td th:text="${patient.age}"></td>
                    <td th:text="${patient.gender}"></td>

                    <td>
                        <span class="badge bg-danger"
                              th:text="${patient.bloodGroup}">
                        </span>
                    </td>

                    <td th:text="${patient.disease}"></td>
                    <td th:text="${patient.phone}"></td>
                    <td th:text="${patient.address}"></td>

                    <td>

                        <a th:href="@{'/editPatient/' + ${patient.patientId}}"
                           class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <a th:href="@{'/deletePatient/' + ${patient.patientId}}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this patient?')">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
