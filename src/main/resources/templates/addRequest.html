<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Blood Request</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-danger text-white">
            <h3>Add Blood Request</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/saveRequest}" th:object="${request}" method="post">

                <input type="hidden" th:field="*{requestId}"/>

                <input type="hidden" th:field="*{status}"/>

                <div class="mb-3">
                    <label>Patient Name</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{patientName}"
                           required>
                </div>

                <div class="mb-3">
                    <label>Blood Group</label>

                    <select class="form-control" th:field="*{bloodGroup}">
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Units Required</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{unitsRequired}"
                           required>
                </div>

                <button class="btn btn-success">
                    Save Request
                </button>

                <a href="/requests" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
