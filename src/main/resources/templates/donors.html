<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Blood Bank Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">

            <h3>Blood Donors</h3>

            <a th:href="@{/addDonor}" class="btn btn-light">
                + Add Donor
            </a>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Blood Group</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="donor : ${donors}">

                    <td th:text="${donor.donorId}"></td>

                    <td th:text="${donor.donorName}"></td>

                    <td th:text="${donor.age}"></td>

                    <td th:text="${donor.gender}"></td>

                    <td>
                        <span class="badge bg-danger"
                              th:text="${donor.bloodGroup}">
                        </span>
                    </td>

                    <td th:text="${donor.phone}"></td>

                    <td th:text="${donor.address}"></td>

                    <td>

                        <a th:href="@{'/editDonor/' + ${donor.donorId}}"
                           class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <a th:href="@{'/deleteDonor/' + ${donor.donorId}}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this donor?')">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
