<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Add Donor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-danger text-white">
                    <h3>Add / Edit Donor</h3>
                </div>

                <div class="card-body">

                    <form th:action="@{/saveDonor}" th:object="${donor}" method="post">

                        <!-- Hidden ID (Required for Edit) -->
                        <input type="hidden" th:field="*{donorId}"/>

                        <div class="mb-3">
                            <label class="form-label">Donor Name</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{donorName}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input type="number"
                                   class="form-control"
                                   th:field="*{age}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Gender</label>
                            <select class="form-select" th:field="*{gender}" required>
                                <option value="">-- Select Gender --</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Blood Group</label>
                            <select class="form-select" th:field="*{bloodGroup}" required>
                                <option value="">-- Select Blood Group --</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{phone}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control"
                                      rows="3"
                                      th:field="*{address}"
                                      required></textarea>
                        </div>

                        <button type="submit" class="btn btn-success">
                            Save Donor
                        </button>

                        <a th:href="@{/donors}" class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
