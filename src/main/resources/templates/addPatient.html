<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Add Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Add / Edit Patient</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/savePatient}" th:object="${patient}" method="post">

                <input type="hidden" th:field="*{patientId}">

                <div class="mb-3">
                    <label>Name</label>
                    <input type="text" class="form-control" th:field="*{patientName}" required>
                </div>

                <div class="mb-3">
                    <label>Age</label>
                    <input type="number" class="form-control" th:field="*{age}" required>
                </div>

                <div class="mb-3">
                    <label>Gender</label>
                    <select class="form-control" th:field="*{gender}">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Blood Group</label>
                    <select class="form-control" th:field="*{bloodGroup}">
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Disease</label>
                    <input type="text" class="form-control" th:field="*{disease}">
                </div>

                <div class="mb-3">
                    <label>Phone</label>
                    <input type="text" class="form-control" th:field="*{phone}">
                </div>

                <div class="mb-3">
                    <label>Address</label>
                    <textarea class="form-control" th:field="*{address}"></textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    Save Patient
                </button>

                <a th:href="@{/patients}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
